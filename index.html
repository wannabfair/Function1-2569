<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Function Factory - Hard Mode</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --panel-bg: #1e293b;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-red: #ef4444;
    --code-bg: #0b1329;
    --text-light: #f8fafc;
  }

  body {
    font-family: 'Kanit', -apple-system, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .factory-card {
    background: var(--panel-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    border: 2px solid #334155;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #334155;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .title {
    font-size: 1rem;
    font-weight: bold;
    color: var(--accent-gold);
  }

  .score-badge {
    background: #334155;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--accent-cyan);
    font-weight: bold;
  }

  .conveyor-stage {
    background: #090d16;
    border-radius: 12px;
    padding: 10px;
    border: 1px solid #1e293b;
    margin-bottom: 12px;
  }

  .belt-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin: 6px 0;
  }

  .box {
    background: #1e293b;
    border: 2px solid var(--accent-cyan);
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
    flex: 1;
    min-height: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .box-title {
    font-size: 0.65rem;
    color: #94a3b8;
  }

  .box-value {
    font-size: 0.85rem;
    font-weight: bold;
    color: #fff;
  }

  .machine-slot {
    flex: 1.4;
    background: var(--code-bg);
    border: 2px dashed var(--accent-gold);
    border-radius: 8px;
    padding: 6px;
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--accent-gold);
  }

  .machine-slot.installed {
    border-style: solid;
    background: #1e1b4b;
    color: #a5b4fc;
  }

  .section-label {
    font-size: 0.8rem;
    color: #94a3b8;
    margin-bottom: 8px;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .machine-card {
    background: var(--code-bg);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .machine-card.selected {
    border-color: var(--accent-gold);
    background: #161e38;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
  }

  .card-label {
    font-weight: bold;
    font-size: 0.75rem;
    color: var(--accent-gold);
    margin-bottom: 3px;
  }

  pre {
    margin: 0;
    font-family: 'Fira Code', Consolas, monospace;
    font-size: 0.75rem;
    color: var(--accent-cyan);
    white-space: pre-wrap;
    line-height: 1.25;
  }

  .run-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent-green);
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 12px;
  }

  .run-btn:disabled {
    background: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }

  .msg-toast {
    text-align: center;
    font-weight: bold;
    margin-top: 8px;
    min-height: 22px;
    font-size: 0.85rem;
  }

  .restart-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent-cyan);
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="factory-card">
  <div class="header">
    <div class="title">🏭 C++ Function Factory (Hard)</div>
    <div class="score-badge" id="level-badge">ด่าน 1/6</div>
  </div>

  <div class="conveyor-stage">
    <div class="belt-container">
      <div class="box">
        <span class="box-title">INPUT</span>
        <span class="box-value" id="input-val">a = 7, b = 2</span>
      </div>

      <div style="color:#64748b;">➔</div>

      <div class="machine-slot" id="machine-slot">
        เลือกตัวเลือก A-D ด้านล่าง
      </div>

      <div style="color:#64748b;">➔</div>

      <div class="box" style="border-color: var(--accent-gold);">
        <span class="box-title">TARGET OUTPUT</span>
        <span class="box-value" id="target-val" style="color: var(--accent-gold);">3.5</span>
      </div>
    </div>
  </div>

  <div id="game-body">
    <div class="section-label">🛠️ เลือกฟังก์ชันที่ตรงตามเงื่อนไขทางไวยากรณ์และตรรกะ C++:</div>
    <div class="options-grid" id="options"></div>
    <button class="run-btn" id="run-btn" disabled onclick="runFactory()">⚡ เดินเครื่องโรงงาน (RUN)</button>
  </div>

  <div id="msg" class="msg-toast"></div>
</div>

<script>
// ==========================================
// คลังโจทย์สายโหด 6 ด่าน (มีช้อยส์หลอกทุกข้อ)
// ==========================================
const levels = [
  {
    inputLabel: "a = 7, b = 2",
    targetLabel: "3.5",
    options: [
      { code: "double div(int a, int b) {\n  return (double)a / b;\n}", correct: true },
      { code: "double div(int a, int b) {\n  return a / b;\n}", correct: false }, // หลอก: Integer Division ได้ 3.0
      { code: "int div(int a, int b) {\n  return (double)a / b;\n}", correct: false }, // หลอก: Return type ตัดทศนิยมเหลือ 3
      { code: "double div(a, b) {\n  return (double)a / b;\n}", correct: false } // หลอก: ขาดชนิดข้อมูลใน Parameter
    ]
  },
  {
    inputLabel: "x = 10",
    targetLabel: "x = 20 (ตัวแปรต้นทางเปลี่ยน)",
    options: [
      { code: "void doubleIt(int &x) {\n  x = x * 2;\n}", correct: true },
      { code: "void doubleIt(int x) {\n  x = x * 2;\n}", correct: false }, // หลอก: Pass by Value ไม่เปลี่ยนค่า x ต้นทาง
      { code: "void doubleIt(int &x) {\n  return x * 2;\n}", correct: false }, // หลอก: void ส่งค่า return ไม่ได้
      { code: "void doubleIt(int x&) {\n  x = x * 2;\n}", correct: false } // หลอก: วางสัญลักษณ์ & ผิดตำแหน่ง
    ]
  },
  {
    inputLabel: "เรียก multiply(val1, val2)\nโดย val1 = 5, val2 = 3",
    targetLabel: "15",
    options: [
      { code: "int multiply(int x, int y) {\n  return x * y;\n}", correct: true },
      { code: "int multiply(int x, int y) {\n  return val1 * val2;\n}", correct: false }, // หลอก: Scope Error (val1, val2 ไม่อยู่ในฟังก์ชัน)
      { code: "int multiply(int x, int y) {\n  int res = x * y\n  return res;\n}", correct: false }, // หลอก: ขาดเครื่องหมาย ;
      { code: "void multiply(int x, int y) {\n  return x * y;\n}", correct: false } // หลอก: void ห้าม return ค่า
    ]
  },
  {
    inputLabel: "เรียก calcTotal(100)\n(ส่ง Argument ตัวเดียว)",
    targetLabel: "107",
    options: [
      { code: "int calcTotal(int base, int tax = 7) {\n  return base + tax;\n}", correct: true },
      { code: "int calcTotal(int tax = 7, int base) {\n  return base + tax;\n}", correct: false }, // หลอก: Default Argument ต้องอยู่ท้ายสุดเท่านั้น
      { code: "int calcTotal(int base, tax = 7) {\n  return base + tax;\n}", correct: false }, // หลอก: ขาด type หน้า tax
      { code: "int calcTotal(int base, int tax) {\n  return base + tax;\n}", correct: false } // หลอก: ขาดค่า Default Parameter
    ]
  },
  {
    inputLabel: "score = 80",
    targetLabel: '"Pass"',
    options: [
      { code: "string getResult(int score) {\n  return (score >= 50) ? \"Pass\" : \"Fail\";\n}", correct: true },
      { code: "string getResult(int score) {\n  return (score = 50) ? \"Pass\" : \"Fail\";\n}", correct: false }, // หลอก: ใช้ = แทน >= (Assignment)
      { code: "string getResult(int score) {\n  if (score >= 50);\n    return \"Pass\";\n  return \"Fail\";\n}", correct: false }, // หลอก: เซมิโคลอนหลัง if ทำให้ return Pass เสมอ
      { code: "char* getResult(int score) {\n  if (score >= 50) return \"Pass\";\n}", correct: false } // หลอก: คืนค่าไม่ครบทุก Branch (Missing else return)
    ]
  },
  {
    inputLabel: "เรียกใช้ฟังก์ชัน 3 ครั้งติดกัน",
    targetLabel: "ครั้งที่ 3 ได้ค่า 3",
    options: [
      { code: "int getCount() {\n  static int c = 0;\n  return ++c;\n}", correct: true },
      { code: "int getCount() {\n  int c = 0;\n  return ++c;\n}", correct: false }, // หลอก: ตัวแปรธรรมดาถูกรีเซ็ตเป็น 0 ทุกครั้งที่เรียก
      { code: "int getCount() {\n  static int c = 0;\n  return c++;\n}", correct: false }, // หลอก: Post-increment ครั้งที่ 3 จะคืนค่า 2
      { code: "int getCount() {\n  static int c;\n  return c + 1;\n}", correct: false } // หลอก: ไม่มีการบวกสะสมค่ากลับเข้า c
    ]
  }
];

let currentLevel = 0;
let selectedOptionIndex = null;

function loadLevel() {
  const lvl = levels[currentLevel];
  selectedOptionIndex = null;

  document.getElementById('level-badge').innerText = `ด่าน ${currentLevel + 1}/${levels.length}`;
  document.getElementById('input-val').innerText = lvl.inputLabel;
  document.getElementById('target-val').innerText = lvl.targetLabel;

  const slot = document.getElementById('machine-slot');
  slot.className = 'machine-slot';
  slot.innerText = 'เลือกตัวเลือก A-D ด้านล่าง';

  document.getElementById('run-btn').disabled = true;
  document.getElementById('msg').innerText = '';

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';

  const labels = ['A', 'B', 'C', 'D'];
  lvl.options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = 'machine-card';
    card.innerHTML = `
      <div class="card-label">ตัวเลือก ${labels[idx]}</div>
      <pre>${opt.code}</pre>
    `;
    card.onclick = () => selectOption(idx);
    optsDiv.appendChild(card);
  });
}

function selectOption(index) {
  selectedOptionIndex = index;
  const cards = document.querySelectorAll('.machine-card');
  const labels = ['A', 'B', 'C', 'D'];

  cards.forEach((card, idx) => {
    if (idx === index) {
      card.classList.add('selected');
    } else {
      card.classList.remove('selected');
    }
  });

  const slot = document.getElementById('machine-slot');
  slot.className = 'machine-slot installed';
  slot.innerHTML = `<div><strong>[เลือกตัวเลือก ${labels[index]}]</strong></div>`;

  document.getElementById('run-btn').disabled = false;
}

function runFactory() {
  if (selectedOptionIndex === null) return;

  const lvl = levels[currentLevel];
  const isCorrect = lvl.options[selectedOptionIndex].correct;
  const msg = document.getElementById('msg');
  const runBtn = document.getElementById('run-btn');

  runBtn.disabled = true;

  if (isCorrect) {
    msg.style.color = 'var(--accent-green)';
    msg.innerText = '✨ ถูกต้อง! ฟังก์ชันทำงานตามข้อกำหนด';
    
    setTimeout(() => {
      currentLevel++;
      if (currentLevel < levels.length) {
        loadLevel();
      } else {
        showWinScreen();
      }
    }, 1200);
  } else {
    msg.style.color = 'var(--accent-red)';
    msg.innerText = '💥 ผิดพลาด! มี Bug หรือไวยากรณ์ C++ ไม่ถูกต้อง';
    
    setTimeout(() => {
      runBtn.disabled = false;
    }, 1400);
  }
}

function showWinScreen() {
  document.getElementById('game-body').innerHTML = `
    <h2 style="text-align:center; color:var(--accent-gold); margin-top:15px;">🏆 ยินดีด้วย! คุณผ่านโหมดสายโหด</h2>
    <p style="text-align:center; color:#94a3b8; font-size:0.85rem;">คุณมองแยกแยะจุดหลอกไวยากรณ์เรื่อง C++ Function ได้อย่างแม่นยำ!</p>
    <button class="restart-btn" onclick="location.reload()">เล่นใหม่อีกครั้ง 🔄</button>
  `;
}

loadLevel();
</script>

</body>
</html>
